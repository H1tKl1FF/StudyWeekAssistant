# Colours of the browser app: white and dark blue.
# The same colours are in styles/tokens.css; these set Streamlit's own boxes,
# buttons and fields. There is a light and a dark version. Streamlit follows the
# computer's setting (system mode) until the student picks Light or Dark in the app.
# Fonts are the computer's own, so nothing is downloaded from a font server.
[theme]
font = "'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, sans-serif"
headingFont = "'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif"
codeFont = "'Cascadia Mono', Consolas, ui-monospace, monospace"
headingFontSizes = ["1.728rem", "1.44rem", "1rem", "1rem", "0.875rem", "0.875rem"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
baseRadius = "6px"
buttonRadius = "8px"
showWidgetBorder = true

[theme.light]
primaryColor = "#194292"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F2F5FB"
textColor = "#0F2248"
borderColor = "#C3CBD6"
linkColor = "#194292"
codeBackgroundColor = "#F2F5FB"
redColor = "#AF2C22"
orangeColor = "#915C08"
yellowColor = "#915C08"
greenColor = "#2C6D3E"
blueColor = "#546175"
redBackgroundColor = "#FBDAD5"
orangeBackgroundColor = "#F9E6BF"
yellowBackgroundColor = "#F9E6BF"
greenBackgroundColor = "#D4F1D8"
blueBackgroundColor = "#E5ECF4"
redTextColor = "#7A1C15"
orangeTextColor = "#5E3B04"
yellowTextColor = "#5E3B04"
greenTextColor = "#1D4A2A"
blueTextColor = "#0F2248"

[theme.dark]
primaryColor = "#87BAFD"
backgroundColor = "#081328"
secondaryBackgroundColor = "#101C34"
textColor = "#F2F5FB"
borderColor = "#364560"
linkColor = "#87BAFD"
codeBackgroundColor = "#101C34"
redColor = "#F7857D"
orangeColor = "#EABC6E"
yellowColor = "#EABC6E"
greenColor = "#7CCD8E"
blueColor = "#ABB9CB"
redBackgroundColor = "#4A2228"
orangeBackgroundColor = "#48381A"
yellowBackgroundColor = "#48381A"
greenBackgroundColor = "#243F2A"
blueBackgroundColor = "#172641"
redTextColor = "#F6C4BB"
orangeTextColor = "#F2D6A8"
yellowTextColor = "#F2D6A8"
greenTextColor = "#BFE3C4"
blueTextColor = "#F2F5FB"

# Only this computer can open the app (not other people on the same Wi-Fi),
# and Streamlit sends no usage statistics.
[server]
address = "localhost"

[browser]
gatherUsageStats = false
